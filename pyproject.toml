[project]
name = "visualsimplex"
version = "0.1.0"
description = "Visualize the pivot steps of the simplex algorithm on linear programming problems"
readme = "README.md"
authors = [
    { name = "Federico Rizzi", email = "federicoandrearizzi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "visualsimplex-bridge",
]

# This package is also the workspace root: `bridge` is a sibling member that depends on it.
# The web app is not a Python package and therefore is not a member.
[tool.uv.workspace]
members = ["bridge"]

[tool.uv.sources]
visualsimplex-bridge = { workspace = true }
